# Retired. This static LiteLLM config is no longer used.
#
# The litellm service now renders its config at container start from .env:
#   integrations/litellm/render_config.py
# Every agent calls one model, `lab-chat`, at http://litellm:4000/v1 with LITELLM_MASTER_KEY.
# LAB_MODEL_PROVIDER (default auto: Azure OpenAI, then OpenAI, Anthropic, Gemini, local Ollama)
# and the provider's key decide what serves it. Langfuse tracing turns on when
# LANGFUSE_PUBLIC_KEY and LANGFUSE_SECRET_KEY are set.
#
# To change provider, model or key: edit .env, then run `docker compose up -d litellm`.
# To see the config that is in use: docker compose exec litellm cat /tmp/lab-litellm/config.yaml
