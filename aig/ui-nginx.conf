# aig-ui: reverse proxy for the AI-Infra-Guard web UI (profile ai-red-team).
#
# It ONLY forwards inbound requests to one fixed upstream, http://aig-webserver:8088. It is not a
# forward proxy: proxy_pass names that one server, so the Host header or an absolute request URI
# cannot send a request anywhere else. No other upstream, no static site, no CONNECT.
# Mounted read-only at /etc/nginx/nginx.conf; see the aig-ui service in docker-compose.yml.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    access_log /dev/stdout;

    # Writable paths live on the tmpfs mounts (the container file system is read-only).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    # Docker's embedded DNS: aig-webserver is found again after it is recreated (new IP address).
    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream aig_webserver {
        zone aig_webserver 64k;
        server aig-webserver:8088 resolve;
    }

    # WebSocket upgrade, when the browser asks for one.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 8088 default_server;
        server_name _;

        # Scan uploads (for example MCP server source archives) stream straight to the upstream.
        client_max_body_size 100m;
        proxy_request_buffering off;

        location / {
            proxy_pass http://aig_webserver;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Scan progress streams as server-sent events: pass them through without buffering.
            proxy_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
        }
    }
}
