name: Live stack

# The whole Standard lab, started from this commit on a hosted runner, then the acceptance tests
# (tests/acceptance) against it. Not a merge gate: it pulls several GB of images and takes about
# 30 minutes. Runs nightly and on demand (Actions > Live stack > Run workflow).
#
# Real model calls happen only when a model key is stored as a repository secret (OPENAI_API_KEY,
# ANTHROPIC_API_KEY, GEMINI_API_KEY, or AZURE_OPENAI_API_KEY with the AZURE_OPENAI_ENDPOINT and
# AZURE_OPENAI_DEPLOYMENT repository variables). Without one, the run makes no model calls; the
# provider plumbing is still proven with the mock provider (--mock-provider).
# The security-lab and ai-red-team profiles are never started here.

on:
  workflow_dispatch:
  schedule:
    - cron: '23 2 * * *'

permissions:
  contents: read

concurrency:
  group: live-stack-${{ github.ref }}
  cancel-in-progress: false

jobs:
  live-stack:
    name: Live stack acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      # The Standard lab (no profile). Never security-lab or ai-red-team.
      COMPOSE_PROFILES: ''
      # The lab image is built from this commit and tagged locally; compose uses it (pull_policy: missing).
      LAB_IMAGE_TAG: ci
      HAS_MODEL_KEY: ${{ secrets.OPENAI_API_KEY != '' || secrets.ANTHROPIC_API_KEY != '' || secrets.GEMINI_API_KEY != '' || secrets.AZURE_OPENAI_API_KEY != '' }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The lab needs about 12 GB of images and volumes; hosted runners ship toolchains it never uses.
      - name: Free disk space
        run: |
          df -h / | tail -n 1
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL /usr/share/swift
          docker image prune -af > /dev/null
          df -h / | tail -n 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the lab image from this commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: docker/n8n
          file: docker/n8n/Dockerfile
          platforms: linux/amd64
          build-args: REVISION=${{ github.sha }}
          tags: ghcr.io/alshawwaf/cp-agentic-n8n:ci
          load: true
          push: false
          provenance: false
          cache-from: type=gha,scope=cp-agentic-n8n-amd64

      - name: Generate .env (setup.sh --non-interactive)
        run: ./setup.sh --non-interactive
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ vars.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT }}

      - name: Guard (the attack-simulation profiles stay off)
        run: |
          if docker compose config --services | grep -E '^(vuln-mcp|aig-webserver|aig-agent)$'; then
            echo "::error::the security-lab or ai-red-team profile is on; the live-stack job never starts them"
            exit 1
          fi

      - name: Preflight (doctor.sh --preflight)
        run: ./scripts/doctor.sh --preflight

      - name: Start the lab and run the acceptance tests
        run: |
          if [ "$HAS_MODEL_KEY" = true ]; then model=--with-model; else model=--no-model; fi
          echo "acceptance: $model --mock-provider"
          tests/integration-test.sh --up --wait 900 -- "$model" --mock-provider --json acceptance.json

      - name: Post-start checks (doctor.sh --post-start)
        if: always()
        run: |
          if [ "$HAS_MODEL_KEY" = true ]; then ./scripts/doctor.sh --post-start; else ./scripts/doctor.sh --post-start --skip-chat; fi

      - name: Upload the acceptance results
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: acceptance-${{ github.run_id }}
          path: acceptance.json
          if-no-files-found: warn
          retention-days: 14

      # Printed to the job log only (registered secrets are masked there; artifacts are not).
      - name: Compose status and logs on failure
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --timestamps --tail 200
