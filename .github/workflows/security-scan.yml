name: Security Scan

on:
  schedule:
    # Run every Monday at 9:00 AM UTC
    - cron: '0 9 * * 1'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  trivy-scan:
    name: Trivy Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # docker-compose.yml now pulls the prebuilt GHCR image, so `docker compose
      # build n8n` is a no-op. Build the same image publish-image.yml ships
      # (n8n + every MCP sidecar) straight from its Dockerfile so PRs are scanned too.
      - name: Build custom n8n / MCP image
        run: docker build -t cp-agentic-n8n:scan -f docker/n8n/Dockerfile docker/n8n

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cp-agentic-n8n:scan'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-results.sarif') != ''
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'cp-agentic-n8n:scan'
          format: 'table'
          severity: 'CRITICAL,HIGH'
